name: Deploy mango-wiki to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "app/mango-wiki/**"
      - "vault/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/mango-wiki
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: app/mango-wiki/pnpm-lock.yaml

      - uses: actions/configure-pages@v5

      - run: pnpm install --frozen-lockfile=false

      - run: pnpm build
        env:
          MANGO_VAULT_DIR: ${{ github.workspace }}/vault

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/mango-wiki/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
